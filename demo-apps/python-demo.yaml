# =============================================================================
# demo-apps/python-demo.yaml
# Proyecto: python-demo | 2 pods | Python 3.12 con stdlib http.server
# =============================================================================

# -----------------------------------------------------------------------------
# 1. Namespace
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Namespace
metadata:
  name: python-demo
  labels:
    app.kubernetes.io/managed-by: demo-apps
    idle-ops/managed: "true"

---
# -----------------------------------------------------------------------------
# 2. Codigo de la aplicacion
# -----------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: python-app-code
  namespace: python-demo
  labels:
    app: python-app
data:
  app.py: |
    #!/usr/bin/env python3
    """
    Demo HTTP server — sin dependencias externas.
    Responde a cualquier ruta con un JSON informativo.
    """
    from http.server import HTTPServer, BaseHTTPRequestHandler
    import json
    import os
    import platform

    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            payload = {
                "app":      "python-demo",
                "version":  "1.0.0",
                "language": f"Python {platform.python_version()}",
                "message":  "Hola desde Python!",
                "hostname": os.environ.get("HOSTNAME", "unknown"),
                "path":     self.path,
            }
            body = json.dumps(payload, indent=2).encode()
            self.send_response(200)
            self.send_header("Content-Type", "application/json; charset=utf-8")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def do_HEAD(self):
            self.send_response(200)
            self.send_header("Content-Type", "application/json")
            self.end_headers()

        def log_message(self, fmt, *args):
            print(f"[{self.log_date_time_string()}] {self.client_address[0]} - {fmt % args}",
                  flush=True)

    if __name__ == "__main__":
        port = int(os.environ.get("PORT", "8080"))
        server = HTTPServer(("0.0.0.0", port), Handler)
        print(f"Python demo server escuchando en 0.0.0.0:{port}", flush=True)
        server.serve_forever()

---
# -----------------------------------------------------------------------------
# 3. Deployment — 2 replicas
# -----------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-app
  namespace: python-demo
  labels:
    app: python-app
    app.kubernetes.io/name: python-app
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: python-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: python-app
        version: "1.0.0"
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: python-app
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent

          command: ["python", "/app/app.py"]

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          env:
            - name: PORT
              value: "8080"
            # Evita que Python intente escribir .pyc en el mount de solo lectura
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi

          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10

          volumeMounts:
            - name: app-code
              mountPath: /app
              readOnly: true

      volumes:
        - name: app-code
          configMap:
            name: python-app-code

---
# -----------------------------------------------------------------------------
# 4. Service
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: python-app
  namespace: python-demo
  labels:
    app: python-app
spec:
  selector:
    app: python-app
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  type: ClusterIP

---
# -----------------------------------------------------------------------------
# 5. Route
# -----------------------------------------------------------------------------
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: python-app
  namespace: python-demo
  labels:
    app: python-app
spec:
  to:
    kind: Service
    name: python-app
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
